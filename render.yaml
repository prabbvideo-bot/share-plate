services:
  # Option 1: Full-Stack Web Service (Node.js + Express with health check)
  - type: web
    name: shareplate-india
    env: node
    plan: free
    region: singapore # Closest to India for optimal latency (or oregon / frankfurt)
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3000

